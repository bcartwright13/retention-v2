databases:
  - name: recall-db
    plan: free
    databaseName: recall
    user: recall

services:
  - type: web
    name: recall
    runtime: node
    plan: free
    buildCommand: npm install --prefix client && npm run build --prefix client && npm install --prefix server && npm run build --prefix server
    startCommand: npm run start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: recall-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://recall.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://recall.onrender.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
