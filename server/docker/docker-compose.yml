services:
  postgres:
    image: postgres:16-alpine
    container_name: recall-postgres
    restart: unless-stopped
    ports:
      # L4: Bind to loopback only so the dev DB is not reachable from other
      # machines on the LAN (or, on some setups, the public internet).
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
      POSTGRES_DB: recall
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
